# Profile for SchemaValidationIT only.
#
# The point of this profile is that Liquibase runs the real changelog against a real
# PostgreSQL container and Hibernate then VALIDATES the entity mappings against what
# Liquibase actually produced. Any drift between the two fails the build.
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Deliberately unresolvable. @ServiceConnection overrides these from the container, so if that
# binding ever silently fails the test must fail loudly here rather than quietly running
# `liquibase update` and a schema validation against whatever database the default URL points
# at — which in this repo is the developer's own local `meditation` database on 5432.
spring.datasource.url=jdbc:postgresql://schema-validation-must-use-a-container:5432/none
spring.datasource.username=none
spring.datasource.password=none

# Dummy R2 credentials. @SpringBootTest component-scans the whole application regardless of
# @ImportAutoConfiguration, so the S3 client bean is still built — and the AWS SDK rejects a
# blank access key at construction time, before any network call. Nothing here is ever used to
# reach R2: this test only ever talks to the Postgres container.
cloudflare.r2.account-id=schema-validation
cloudflare.r2.access-key-id=schema-validation
cloudflare.r2.secret-access-key=schema-validation
cloudflare.r2.bucket=schema-validation
cloudflare.r2.public-picture-base-url=https://schema-validation.invalid

# Same reasoning: the JWT decoders are built eagerly from these, and a blank issuer fails
# @Validated at startup. No token is ever presented to this context.
app.security.jwt.issuer=https://schema-validation.invalid/realms/yogida
app.security.jwt.admin-issuer=https://schema-validation.invalid/realms/yogida-admin
app.security.jwt.audience=schema-validation
app.security.jwt.client-id=yogida
app.security.jwt.admin-client-id=yogida-admin
app.revenuecat.api-key=schema-validation
app.revenuecat.webhook-auth-token=schema-validation
