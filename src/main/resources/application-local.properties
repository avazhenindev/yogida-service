# Profile for running the service directly on the host (IDE, ./mvnw spring-boot:run) with
# the rest of the stack in Docker.
#
# This profile is referenced by LocalCorsConfig but had no properties file until now, so
# activating it changed nothing.

# The containers publish Postgres on loopback; everything else is reached through the edge.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/meditation}

# Permissive by default here, because a host-run service is usually being poked at from a
# Vite dev server, curl or an HTTP client on some other port. Narrow it by setting
# CORS_ALLOWED_ORIGINS explicitly.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Verbose locally. Never set this in a deployed environment: the request/response aspect
# logs full arguments and response bodies, which include emails and presigned R2 URLs.
logging.level.com.yogida.meditation=${LOGGING_LEVEL_COM_YOGIDA_MEDITATION:DEBUG}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
