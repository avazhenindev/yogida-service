# Profile for running inside the compose stack, behind the nginx edge.
#
# The admin panel is served from the same origin as the API, so no CORS entry is needed for
# it. CORS_ALLOWED_ORIGINS is still honoured for a host-run frontend that bypasses the edge.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# The edge terminates the client connection, so honour its forwarded headers when building
# absolute URLs — otherwise redirects and links carry the container's own address.
server.forward-headers-strategy=framework

logging.level.com.yogida.meditation=${LOGGING_LEVEL_COM_YOGIDA_MEDITATION:INFO}
