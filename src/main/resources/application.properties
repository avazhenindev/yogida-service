spring.application.name=cloudflare-f2

# -- PostgreSQL -----------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/meditation}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:backend}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# -- JPA / Hibernate ------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# -- Liquibase -------------------------------------------------
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# -- Cloudflare R2 ---------------------------------------------
cloudflare.r2.account-id=${CLOUDFLARE_R2_ACCOUNT_ID:}
cloudflare.r2.access-key-id=${CLOUDFLARE_R2_ACCESS_KEY_ID:}
cloudflare.r2.secret-access-key=${CLOUDFLARE_R2_SECRET_ACCESS_KEY:}
cloudflare.r2.bucket=${CLOUDFLARE_R2_BUCKET:}
cloudflare.r2.public-picture-base-url=${CLOUDFLARE_R2_PUBLIC_PICTURE_BASE_URL:}

app.audio.presigned-url-duration-minutes=${APP_AUDIO_PRESIGNED_URL_DURATION_MINUTES:60}

app.media.max-picture-size-bytes=${APP_MEDIA_MAX_PICTURE_SIZE_BYTES:512000}
app.media.duration.ffprobe-path=${APP_MEDIA_DURATION_FFPROBE_PATH:ffprobe}

# -- CORS -------------------------------------------------------
# Comma-separated browser origins the API accepts, or * for a permissive local setup.
# Empty means no CORS bean is created at all and cross-origin requests are refused, which
# is correct when every browser client is served from the same origin behind the edge.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# -- JWT / OAuth2 Resource Server -----
# No defaults on the issuers, deliberately. These previously fell back to the production
# Keycloak URLs, so a local run with the variables unset would validate tokens against
# production and fail in a way that looked like a code problem. Unset now means the context
# refuses to start and names the missing property.
#
# The issuer must match Keycloak's KC_HOSTNAME exactly, character for character, or every
# request 401s. Both are derived from PUBLIC_ORIGIN in compose/services.yml.
app.security.jwt.issuer=${APP_SECURITY_JWT_ISSUER}
app.security.jwt.admin-issuer=${APP_SECURITY_JWT_ADMIN_ISSUER}

# Optional: when blank, JwtProperties derives them as <issuer>/protocol/openid-connect/certs.
app.security.jwt.jwk-set-uri=${APP_SECURITY_JWT_JWK_SET_URI:}
app.security.jwt.admin-jwk-set-uri=${APP_SECURITY_JWT_ADMIN_JWK_SET_URI:}

# Required aud claim. A realm audience mapper must emit exactly this value.
app.security.jwt.audience=${APP_SECURITY_JWT_AUDIENCE:yogida}

# Keycloak client ids. Roles are read from resource_access.<client-id>.roles, so these must
# match the realm clients or no role is ever granted.
app.security.jwt.client-id=${APP_SECURITY_JWT_CLIENT_ID:yogida}
app.security.jwt.admin-client-id=${APP_SECURITY_JWT_ADMIN_CLIENT_ID:yogida-admin}

# -- RevenueCat -------------------------------------------------
app.revenuecat.entitlement-id=${APP_REVENUECAT_ENTITLEMENT_ID:premium}
app.revenuecat.webhook-auth-token=${APP_REVENUECAT_WEBHOOK_AUTH_TOKEN:}
app.revenuecat.api-key=${APP_REVENUECAT_API_KEY:}
app.revenuecat.api-base-url=${APP_REVENUECAT_API_BASE_URL:https://api.revenuecat.com/v1}
# How long a resolved entitlement is held in memory. Long on purpose, to stay inside
# RevenueCat's free-tier request budget; safe because the cached value carries its own
# expiry and is re-checked against the clock on every read.
app.revenuecat.entitlement-cache-ttl=${APP_REVENUECAT_ENTITLEMENT_CACHE_TTL:24h}
# How stale the durable user_entitlement projection may get before a read refreshes it.
# This is the real upper bound on how long entitlement can be wrong after a missed webhook.
app.revenuecat.projection-max-age=${APP_REVENUECAT_PROJECTION_MAX_AGE:24h}
# How long processed webhook event ids are remembered for deduplication.
app.revenuecat.webhook-ledger-retention=${APP_REVENUECAT_WEBHOOK_LEDGER_RETENTION:30d}
# How long a failed RevenueCat lookup suppresses further attempts for the same user. Keeps an
# outage from being amplified once per premium item in a response. Not an entitlement answer.
app.revenuecat.outage-suppression=${APP_REVENUECAT_OUTAGE_SUPPRESSION:30s}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

server.port=${SERVER_PORT:8080}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/api}

# -- Logging ----------------------------------------------------
logging.file.path=${LOGGING_FILE_PATH:logs}
logging.file.name=${LOGGING_FILE_NAME:${logging.file.path}/meditation-service.log}
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.yogida.meditation=${LOGGING_LEVEL_COM_YOGIDA_MEDITATION:DEBUG}
logging.logback.rollingpolicy.file-name-pattern=${LOGGING_FILE_NAME_PATTERN:${logging.file.path}/archive/meditation-service.%d{yyyy-MM-dd}.%i.log.gz}
logging.logback.rollingpolicy.max-file-size=${LOGGING_FILE_MAX_SIZE:10MB}
logging.logback.rollingpolicy.max-history=${LOGGING_FILE_MAX_HISTORY:14}
logging.logback.rollingpolicy.total-size-cap=${LOGGING_FILE_TOTAL_SIZE_CAP:1GB}

# -- Actuator ---------------------------------------------------
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info

# -- Multipart uploads ----------------------------------------
spring.servlet.multipart.max-file-size=${SPRING_MULTIPART_MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${SPRING_MULTIPART_MAX_REQUEST_SIZE:110MB}
# Tomcat connector limit — must be >= max-request-size (-1 = unlimited)
server.tomcat.max-http-form-post-size=-1

# -- Debug Properties ------------------------------------------
app.debug.print-props=${PRINT_PROPS:false}

#debug=true
